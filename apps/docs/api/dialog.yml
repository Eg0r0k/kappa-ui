component: Dialog
file: ui/dialog/Dialog.vue
props:
  open:
    description: "Whether it is open, bound with `v-model:open`."
  defaultOpen:
    description: "Whether the dialog starts open when `v-model:open` is not used."
  modal:
    description: "Shuts the page while open: focus stays in the window, the page does not scroll, and the overlay takes outside clicks. Off, the page stays live and has no overlay."
  unmountOnHide:
    description: "Removes the window from the DOM while closed. Turn it off to keep its state between openings."
emits:
  update:open: "Fires when the dialog opens or closes."
slots:
  default: "The trigger and the content. Receives `open` and `close`."
