component: Tree
file: ui/tree/Tree.vue
exposedType:
  file: ui/tree/index.ts
  name: TreeExpose
props:
  items:
    description: The top-level nodes. A node's `children` are its subtree; `[]` makes a folder that is empty or not loaded yet. Replace the array, or a node's `children`, to change them.
  modelValue:
    description: The selected node, or an array of them with `multiple`, bound with `v-model`. The tree emits the nodes you passed in, not copies, and an array in tree order.
  defaultValue:
    description: The starting selection when `v-model` is not used.
  multiple:
    description: Lets more than one node be selected; `v-model` is then an array.
  expanded:
    description: The keys of the expanded nodes, bound with `v-model:expanded`.
  defaultExpanded:
    description: "The starting expanded keys when `v-model:expanded` is not used. Left out, nodes with `defaultExpanded: true` start expanded."
  selectionBehavior:
    description: "`toggle` adds or removes a node on each click, so clicking the selected node clears it. `replace` keeps a node selected; with `multiple`, a click replaces the selection, Ctrl or ⌘ adds to it, and Shift or Shift + arrows select a range."
  checkbox:
    description: Puts a checkbox in every row and uses `aria-checked`. Turns on `multiple` and `cascade`; add `multiple` too so `v-model` is typed as an array.
  cascade:
    description: Checking a parent checks every enabled node under it, and a parent counts as checked while all its children are, indeterminate while some are. On by default with `checkbox`.
  getKey:
    description: Returns a node's unique key, a string. By default `id`, then `value`, then `label`. Paths make good keys for files.
  getChildren:
    description: Returns a node's children, `undefined` for a leaf. By default `children`.
  labelKey:
    description: The field the default row shows, and the virtualized typeahead matches. A dotted path reads a nested field.
  toggleOnClick:
    description: "`false` makes a click on a row select it only; the chevron or a double click expands it. The keyboard is the same either way."
  virtualize:
    description: Renders only the rows near the view. `true`, or `{ overscan, estimateSize }`. The tree becomes the scroller, so give it a height, such as `class="h-80"`; rows get a fixed height.
  name:
    description: Submits the selected keys with their form under this name, one hidden input each.
  id:
    description: Overrides the `id` taken from a surrounding field.
  disabled:
    description: Disables every row. Also set by a disabled field.
  required:
    description: Marks the tree required with `aria-required`. Also set by a required field.
  dir:
    description: Reading direction for Left and Right.
  variant:
    description: "`ghost` draws no frame, for sidebars and cards; `outline` draws a card-like frame, as on Listbox."
  size:
    description: Sets the height, padding, gap, icons, indent and text of the rows, from `xs` to `xl`, after the [control scale](/docs/getting-started/sizing). `md` is the default.
emits:
  update:modelValue: Fires when the selection changes.
  update:expanded: Fires when a node expands or collapses, with the expanded keys. Load a folder's children here.
  select: Fires when a row is clicked or chosen with Enter or Space, with the event and the node. Call `event.preventDefault()` to keep the selection as it is.
  toggle: Fires before a row expands or collapses from a click or an arrow key, with the event and the node. Call `event.preventDefault()` to stop it.
slots:
  default: Replaces the rows, with `{ items, modelValue, expanded }`. Render a `TreeItem` for each of `items`. Not used with `virtualize`.
  item: Replaces a row's whole content, with the row's state.
  item-leading: Before the label, where the node's `icon` goes, with the row's state.
  item-label: The label, with the row's state.
  item-trailing: After the label, with the row's state.
exposed:
  expandAll: Expands every node that has children.
  collapseAll: Collapses every node.
  scrollToKey: Scrolls a visible node into view, rendering it first when virtualized, and returns whether it is visible.
