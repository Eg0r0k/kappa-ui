component: DialogScrollContent
file: ui/dialog/DialogScrollContent.vue
props:
  showCloseButton:
    description: "Shows a close button in the window's top corner. It comes last in the tab order, so a form's first field takes focus on open."
  forceMount:
    description: "Keeps the window mounted while closed, for animating it with a JavaScript library."
  disableOutsidePointerEvents:
    description: "Blocks pointer events outside the window. On by default in a modal dialog; a non-modal dialog ignores it."
  asChild:
    description: "Not supported on this part: the window always adds its own close button, and core adds the hidden title fallback, so there is more than one node to merge onto a single child."
  as:
    description: "The element or component to render."
emits:
  escapeKeyDown: "Fires on Escape. Call `preventDefault()` to keep it open."
  pointerDownOutside: "Fires on a pointer press outside. A press on the overlay's scrollbar does not close it. Call `preventDefault()` to keep it open."
  focusOutside: "Fires when focus moves outside. Call `preventDefault()` to keep it open."
  interactOutside: "Fires on any press or focus outside. Call `preventDefault()` to keep it open."
  openAutoFocus: "Fires when focus moves into the window on open. Call `preventDefault()` to keep focus where it is."
  closeAutoFocus: "Fires when focus returns to the trigger on close. Call `preventDefault()` to keep focus where it is."
slots:
  default: "The window's parts. The window keeps its full height and the overlay scrolls."
