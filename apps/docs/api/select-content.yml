component: SelectContent
file: ui/select/SelectContent.vue
props:
  forceMount:
    description: "Keeps the panel mounted while closed, for animating it with a JavaScript library."
  position:
    description: "`popper` opens the list below or above the trigger. `item-aligned` opens it over the trigger with the selected option where the trigger's text is, as a native select does on macOS."
  bodyLock:
    description: "Stops the page from scrolling while the list is open."
  loop:
    description: "Wraps arrow-key navigation from the last option to the first and back. Needs `reka-ui` 2.11 or later."
  memoDependencies:
    description: "Values that should re-run the position update when they change."
  side:
    description: "The side of the trigger to open on. Flips to the other side when there is no room, unless `avoidCollisions` is off."
  sideOffset:
    description: "Distance in pixels from the trigger."
  sideFlip:
    description: "Flips to the opposite side when the preferred one would overflow."
  align:
    description: "Alignment against the trigger along the chosen side."
  alignOffset:
    description: "Offset in pixels from the `align` position."
  alignFlip:
    description: "Flips the alignment when it would overflow."
  avoidCollisions:
    description: "Keeps the panel inside the collision boundary by flipping and shifting it."
  collisionBoundary:
    description: "The element or elements used as the collision boundary. The viewport by default."
  collisionPadding:
    description: "Distance in pixels from the boundary edges where collisions start."
  arrowPadding:
    description: "Padding between an arrow and the panel's corners."
  hideShiftedArrow:
    description: "Hides an arrow when the panel is shifted so far that the arrow would not point at the trigger."
  sticky:
    description: "`partial` keeps the panel attached to the trigger while scrolling; `always` also lets it detach from the trigger to stay in the boundary."
  hideWhenDetached:
    description: "Hides the panel when the trigger is scrolled out of view."
  positionStrategy:
    description: "The CSS position used to place the panel."
  updatePositionStrategy:
    description: "`always` recomputes the position on every animation frame instead of only on layout changes."
  disableUpdateOnLayoutShift:
    description: "Stops recomputing the position when the layout shifts."
  prioritizePosition:
    description: "Keeps the preferred side and alignment and lets the panel overflow instead of flipping."
  reference:
    description: "A virtual element to position against instead of the trigger."
  dir:
    description: "Reading direction. Mirrors the layout and arrow keys in `rtl`."
  asChild:
    description: "Render the single child instead of a wrapper, merging this part's attributes and classes onto it."
  as:
    description: "The element or component to render."
  disableOutsidePointerEvents:
    description: "Makes the list modal. On by default; turn it off to let outside clicks reach the page."
  size:
    description: "Item height, padding and text, `xs` to `xl` as on Menu. Left out, the list takes the trigger's size."
emits:
  closeAutoFocus: "Fires when focus returns to the trigger on close. Call `preventDefault()` to keep focus where it is."
  escapeKeyDown: "Fires on Escape. Call `preventDefault()` to keep it open."
  pointerDownOutside: "Fires on a pointer press outside. Call `preventDefault()` to keep it open."
slots:
  default: "The items, groups, labels and separators."
