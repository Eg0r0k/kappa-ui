component: TabsList
file: ui/tabs/TabsList.vue
props:
  variant:
    description: "`pill` puts the tabs on a filled track with a raised thumb under the active one; `line` underlines the active tab."
  size:
    description: "Tab height, from 28px for `xs` to 48px for `xl`, with matching padding, text and icon size."
  loop:
    description: "Arrow keys wrap from the last tab to the first and back."
  as:
    description: The element or component to render.
  asChild:
    description: "Not useful here: the list always adds the indicator after its content, so it never has a single child to merge onto."
slots:
  default: "The triggers. The indicator is added after them."
