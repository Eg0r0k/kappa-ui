component: DatePickerContent
file: ui/date-picker/DatePickerContent.vue
props:
  forceMount:
    description: "Keeps the panel mounted while closed, for animating it with a JavaScript library."
  memoDependencies:
    description: "Values that should re-run the position update when they change."
  side:
    description: "The side of the field to open on. Flips to the other side when there is no room, unless `avoidCollisions` is off."
  sideOffset:
    description: "Distance in pixels from the field. `4` by default."
  sideFlip:
    description: "Flips to the opposite side when the preferred one would overflow."
  align:
    description: "Alignment against the field along the chosen side. `start` by default, so the calendar lines up with the field's start."
  alignOffset:
    description: "Offset in pixels from the `align` position."
  alignFlip:
    description: "Flips the alignment when it would overflow."
  avoidCollisions:
    description: "Keeps the panel inside the collision boundary by flipping and shifting it."
  collisionBoundary:
    description: "The element or elements used as the collision boundary. The viewport by default."
  collisionPadding:
    description: "Distance in pixels from the boundary edges where collisions start. `8` by default."
  arrowPadding:
    description: "Padding between an arrow and the panel's corners."
  hideShiftedArrow:
    description: "Hides an arrow when the panel is shifted so far that the arrow would not point at the field."
  sticky:
    description: "`partial` keeps the panel attached to the field while scrolling; `always` also lets it detach from the field to stay in the boundary."
  hideWhenDetached:
    description: "Hides the panel when the field is scrolled out of view."
  positionStrategy:
    description: "The CSS position used to place the panel."
  updatePositionStrategy:
    description: "`always` recomputes the position on every animation frame instead of only on layout changes."
  disableUpdateOnLayoutShift:
    description: "Stops recomputing the position when the layout shifts."
  prioritizePosition:
    description: "Keeps the preferred side and alignment and lets the panel overflow instead of flipping."
  reference:
    description: "A virtual element to position against instead of the field or the trigger."
  dir:
    description: "Reading direction. Mirrors the layout and arrow keys in `rtl`."
  asChild:
    description: "Render the single child instead of a wrapper, merging this part's attributes and classes onto it."
  as:
    description: "The element or component to render."
  disableOutsidePointerEvents:
    description: "Shuts the page to the pointer while open, as `modal` on the root does."
emits:
  escapeKeyDown: "Fires on Escape. Call `preventDefault()` to keep it open."
  pointerDownOutside: "Fires on a pointer press outside. Call `preventDefault()` to keep it open."
  focusOutside: "Fires when focus moves outside. Call `preventDefault()` to keep it open."
  interactOutside: "Fires on any press or focus outside. Call `preventDefault()` to keep it open."
  openAutoFocus: "Fires before focus moves to the selected day, today or the first day you can pick. Call `preventDefault()` to keep focus where it is."
  closeAutoFocus: "Fires when focus returns to the trigger on close. Call `preventDefault()` to keep focus where it is."
slots:
  default: "The calendar, and whatever goes with it: presets, a Done button, a note."
