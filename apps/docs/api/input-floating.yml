component: InputFloating
file: ui/input-floating/InputFloating.vue
props:
  modelValue:
    description: The value, bound with `v-model`.
  label:
    description: The label drawn inside the input and tied to it as its `<label>`. Makes every variant but `outline` taller.
  defaultValue:
    description: The starting value when `v-model` is not used.
  variant:
    description: "`outline` draws a border with a gap for the label, `soft` a tinted surface without one, `filled` a tinted surface with a line underneath, `ghost` nothing until hovered or focused, and `subtle` a tinted surface with a border."
  size:
    description: Height. In `outline`, from 28px for `xs` to 48px for `xl`, as on Input; in the other variants from 40px to 56px, to fit the label above the text.
  id:
    description: Overrides the `id` taken from a surrounding field, or the generated one.
  disabled:
    description: Disables the input. Also set by a disabled field.
  required:
    description: Marks the input required and adds an asterisk to the label. Also set by a required field.
emits:
  update:modelValue: Fires as the value changes.
