name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changesets.outputs.has-changesets == 'false'
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/nuxt-seo
          key: og-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: og-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm build
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm exec wrangler pages deploy apps/docs/.output/public --project-name kappa-ui --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
